# v2 strategy config (5minSnip port) — paper run.
# Separate from config/bot.toml (the anti-drift'd legacy config) so the operative
# bot.toml is never touched. Run: cargo run -- --mode paper --config config/bot_v2.toml
#
# v2 = vol-normalized z edge-gate + depth-aware edge-proportional sizing + rolling
# recalibration. Exits are BASELINE (hold-to-settle): v2 sets exit_ts_s past
# resolution and the redemption task claims the winner. No per-cell exit rules.

[mode]
default = "paper"
live_confirmation_required = true

[markets]
# 5m + 15m. 15m runs as its OWN strategy (see [v2.i15m]): late-entry only, higher
# z_min, price cap, and its OWN calibration curve + recalibrator. The 15m late-entry
# edge (+0.10 EV/$1 in the June recorder) is distinct from the 5m edge; the two
# never share a recal so they can't cross-bias.
intervals = ["5m", "15m"]
assets = ["BTC", "ETH"]
polymarket_token_ids = []
discovery_lookahead = 2
discovery_refresh_secs = 60
disabled_cells = []

[stakes]
# base = stake at the reference edge (v2.edge_ref); edge sizing scales around it,
# capped by max_position_usdc. STARTUP defaults only — the dashboard overrides both
# live (per-interval). Set to the live $1 size so a restart never jumps to big stakes.
base_usdc = 1.05
# 3.15 = base * stake_mult_cap (3) — the burst/tick-age sizing tiers (Order #5 A) can
# push a single stake to base*3, so max_position (the exposure guard + burst clamp)
# MUST accommodate it or high-burst trades get throttled. The dashboard "max" input
# overrides this live; set it to >= 3.15 there too (per-interval) for tiers to size.
max_position_usdc = 3.15
max_open_positions = 20
paper_initial_usdc = 1000.0

[filters]
h2_enabled = true
h2_lower = 0.10
h2_upper = 0.90

[gates]
book_freshness_ms = 500
balance_min_usdc = 2.0
phase_c_threshold_c = 0.10

[rules]
regla_c_enabled = false
dca_enabled = false
max_slippage = 0.04

[connections]
binance_ws_url = "wss://stream.binance.com:9443/ws"
polymarket_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws"
polymarket_rest_url = "https://clob.polymarket.com"
reconnect_max_attempts_per_60s = 5
connect_timeout_s = 10
polymarket_gamma_url = "https://gamma-api.polymarket.com"

[logging]
level = "info"
trace_path = "logs"
rotation = "daily"
event_logger_enabled = false

[paths]
state_file = "data/v2/state.json"
timestamps_file = "data/v2/timestamps.jsonl"
bot_log_file = "logs/bot_v2.log"
alert_dir = "alerts"

# v2 strategy — the validated edge-gate brain.
[v2]
enabled = true
# edge_min 0.01 (Order #6 refit): RE-BASED to the honest curve. 0.06 was calibrated
# against the inflated May cal_w; on the refit scale the same edge region sits at
# ~0.01-0.08. SHIP WITH cal_w BELOW — never separately (knots without this re-base
# halve volume + lose money; 0.02 ok, 0.03 falls off a cliff — all tested). Refit
# passed both hold-outs (recorder 9d +$23.4 vs +$20.3/day; July live +$12.0 vs
# +$10.5, EV/trade +29%). Deploy step: delete data/v2/recal.json (5m only).
edge_min = 0.02   # Order #7 D: 0.01 -> 0.02 (5m). Inside the validated plateau
                  # (0.01-0.02 flat; cliff at 0.03 — do NOT go there). Trims the
                  # bottom half of the thinnest honest band [0.01,0.03) which lost
                  # -$9.07 on the burn night, at ~zero expected cost per the refit.
# 5m calibration curve (A4 → config). cal_z UNCHANGED; cal_w re-based to the honest
# scale (the May curve ran +7.8pts hot, which is why recal bias climbed to 0.175).
cal_z = [0.14, 0.45, 0.80, 1.24, 1.74, 2.46, 3.82, 10.49]
cal_w = [0.536, 0.615, 0.664, 0.737, 0.767, 0.767, 0.767, 0.767]
# z_min: minimum vol-normalized displacement to enter. THE fix for firing on
# noise at the window open -- live showed the bot entered ~every window at ~0.9bps
# displacement (z~0.1) where pcal was a bogus ~0.59. 0.45 = the May knot whose
# win rate is ~0.68 (the real backtested edge region). Sub-second polling stays
# ON; this gate makes it only fire on a REAL move.
z_min = 0.45
# tick_driven: OFF. Live diagnosis (Jun 30) showed the edge is ALIVE in the
# recorder (~70% win every day on 1s bars) but live only got 57-59% even on
# zero-slippage fills -- because tick-driven computes z from NOISY sub-second
# aggTrade prices and fires on transient spikes a 1s bar would smooth away. The
# 70% backtest IS the 1s-bar (tick_driven=false) path, so this should recover the
# edge. Sub-second speed turned out to HURT (noisier entries), not help.
tick_driven = false
# min ms between tick-driven evaluations (throttle the aggTrade firehose).
tick_throttle_ms = 200
vol_cap = 1.0
dvr_floor = 0.2
edge_ref = 0.08
min_ttl_s = 30
# frozen_tape_secs: skip a 5m entry if Binance hasn't ticked in this many seconds
# (stale move -> book already caught up -> no lag to buy). Validated on 26 recorder
# days: frozen entries -0.04/$1, monotone in staleness, self-throttling (blocks
# ~18-20% on dead tapes, ~5-9% on lively ones). 3 = validated. 0 = off. 15m unaffected.
frozen_tape_secs = 3
# max_ttl_s: skip the first minute of the 5m window (only enter when ttl <= 240s).
# Live (Jul 2, 452 trades) + recorder both show early-window entries are the −EV
# drag: ttl<=240 booked +$20.96 vs ttl>240 −$8.62 on the same day; and the (240,270]
# bucket alone was −$17 across two independent days + both assets. The recorder
# backtests that validated the strategy never held a ttl>180s trade, so this closes
# an un-validated envelope. This DOMINATES an ask floor (a proxy for the same thing)
# and keeps more volume. 0 = off.
max_ttl_s = 240
# inval_stop_enabled: signal-invalidation stop (TOUCH). While a position is live,
# exit the instant side-signed displacement-from-window-open reverts to <= 0 (the
# entry thesis is dead). 5m SELLS at the bid (only when ARMED); 15m (both assets)
# is PAPER-LOGGED only (oplog "inval_stop" action=paper) to gather evidence.
# Backtest (recorder, honest touch fills): hold +0.04 -> stop +0.12 EV/$1 (~3x),
# variance -40%, 28/28 days positive; breakeven fill haircut 8-11c. Win RATE drops
# to ~52% BY DESIGN (clips winners that dip through open) -- EV/Sharpe are what rise.
# Graduation: BTC-15m -> live once paper dEV over >=150 stops confirms at real
# fills; ETH-15m needs that AND a non-negative late-window split. Default false.
inval_stop_enabled = true
# inval_stop_dry_run: when the stop is enabled, DRY-RUN first — compute + log every
# would-fire (oplog "inval_stop" dry_run=true) but send NO sell, even 5m while armed.
# Run ~1 day, confirm trigger fires on ~55% of positions, THEN set false to go live.
inval_stop_dry_run = false
# BID-BAND conditional stop (dynstop_study, 26 recorder days post-frozen-gate):
# the stop only fires when the live bid is in an OVERPAY band (>= hi OR <= lo) —
# the fair mid-band (0.30,0.50) has no stale-bid premium to harvest and whipsaws,
# so HOLD. Statistical TIE with the unconditional stop on normal days (100% edge
# retained) + turned the Jul 3-4 dead-vol live replay from -$12.15 to +$9.07
# (median dead-day stop bid 0.40 = dead center of the worthless band). Continuous:
# a suppressed trigger re-checks each second and fires if the bid later enters a
# band. Same bands for 5m + 15m (paper) for dataset comparability. Set hi=1.0 &
# lo=0.0 to revert to the unconditional stop.
stop_bid_hi = 0.50
stop_bid_lo = 0.30
# Order #9 B: ask FLOOR (both intervals), 0.30 = ON. Every validated study gated
# ask >= 0.30; below it the win-prob curve is maximally wrong (dead-tape z-explosion
# → a 7c ask scored "edge +0.50"). Rare (1/122 live) — a hole, not a volume change.
# 0 = disable. 15m composes it with max_ask = 0.70 → band [0.30, 0.70].
min_ask = 0.30
# BOOK-UNMOVED entry gate: skip an entry unless the PM book's mid was UNMOVED in
# the ~3s before the decision (the book-side half of the lag detector; the
# Binance-side half is frozen_tape_secs). Entries where the book had already
# repriced bled -$0.21/trade (84% of the Jul 4-5 loss); unmoved entries were
# breakeven on dead tape, +0.65/$1 on normal recorder tape. Skips only affirmative
# movement (mid_move_3s > 0); an unobservable book passes. true = on.
book_unmoved_gate = true
# RE-ENTRY after a band-stop (Handoff #3 feature A): a stopped market becomes
# eligible for ONE more entry (max 2/market), either side, FCFS to the first fresh
# signal clearing the full gate stack. Validated: opposite +0.144/$1, same +0.132;
# expected +23.5% volume, ~+26% $/day. Logs reentry/reentry_side/secs_since_stop.
reentry_enabled = true
# Independent per-side re-entry toggles (Handoff #4 Decision 3). Same-side is on
# probation: pre-registered kill-rule = if same-side cumulative net < -$15 at n=100,
# set reentry_same_enabled = false (no redeploy needed — dashboard-persisted controls
# not required; a config flip + restart suffices). Opposite is the validated winner.
# Order #7 B: SAME-side re-entry OFF. Live 25% WR, -$3.89 cumulative; its failure
# mechanism (re-firing into the whipsaw that just stopped entry #1) IS the burn-night
# regime. Opposite stays ON (validated +0.144/$1). Re-arm same-side only after the
# canary (Part C) can cut chop exposure and n grows under paper.
reentry_same_enabled = false
reentry_opposite_enabled = true
# Order #7 C: regime canary. false = kill switch (always GREEN, no de-risk/halt).
# AMBER (hold-WR<0.50 or vol-accel) caps stake mult to 1.0 + suspends re-entries;
# RED (hold-WR<0.45) halts all entries for that asset until a 60m cooldown + a
# clean probation. Per-asset, counterfactual-scored (stops included).
canary_enabled = true
# Order #9 C3: strict book-gate. false = today's behavior + C2 measurement only
# (v2_book_gate_unobservable events + stats.book_unobservable count). true = BLOCK
# entries whose PM book is unobservable (WS-gap/thin coverage). Ships OFF; the
# item-E study decides on the measured rate (recorder implied ~60% block, live ~17%
# — the gap is the leading suspect for these blind passes). Do NOT enable yet.
book_gate_strict = false
# Order #8 D entry floors (5m), both 0.0 = OFF (default). Guard the dead-tape
# z-explosion (tiny |disp| over a ~0 vol60 denom → huge z → false p on a nothing
# move — the phantom's layer 3). The auditor sizes these on recorder data before
# flipping them on; the burn-night |disp| averaged 1.5bps so a careless floor cuts
# real volume. disp_floor_bps: reject if |disp_bps| below it. vol60_floor: reject
# if vol60 below it (same units as vol_cap).
# Order #10 B — 5m POPULATION RESCUE. disp_floor_bps 0.0 -> 2.0. Three witnesses
# agree the |disp| < 2bps cell was NEVER edge: recorder WR 0.575 and -0.017/trade
# EVEN idealized; live fills WR 0.546, -0.003/$1 (n=423); 49% end photo-finish (the
# 7c phantom's home). |disp| >= 2bps: recorder 0.704, live 0.671 +0.088/$1 (n=170).
# The junk drove the pooled recal bias to 0.231, which strangled the whole interval.
# Floor removes it; the fresh recal (recal.json deleted at deploy) re-measures the
# clean cell.
# Order #11 A — 5m REGIME FLOOR. vol60_floor 0.0 -> 0.12. The disp floor cut the
# photo-finish junk but NOT the dead-tape regime itself: entries where vol60 (the
# realized-vol denom, vol_cap units) is near-zero are the flat-tape grind that ate
# the $25 death — no lag to harvest, book already fair. 0.12 sits below the live
# median vol60 on lively tape (keeps real volume) and above the dead-grind cluster.
# Composes WITH disp_floor_bps: an entry must clear BOTH (real move AND live tape).
# Expected steady-state ~40-50 trades/day; re-measured by the fresh recal at deploy.
disp_floor_bps = 2.0
vol60_floor = 0.12
vol_lookback_s = 60
recal_capacity = 300
recal_warmup = 50
recal_path = "data/v2/recal.json"

# 15-MINUTE market as its own strategy — FORMULA-V2 (entry15_study, IS/OOS + my
# independent rebuild; the volume-vs-money frontier winner):
#   * vol_lookback_s 120: horizon-matched. A 60s vol window is too twitchy for a
#     900s market -> mis-scaled z. 120s makes z honest so the EDGE gate can select.
#   * z_min 0.70: with vol120 the low-z region is reliable (edge does the work),
#     so we DON'T sacrifice volume for a high z-floor (0.70 chosen for margin).
#   * late_entry_max_ttl_s 540: widened window (works under vol120, bled under vol60).
#   * max_ask 0.70: quality cap (unchanged).
# vs the old vol60/z0.80/<=360: SAME ~58 trades/day, higher EV/trade in BOTH IS and
# OOS (my rebuild: +0.081/+0.140 vs +0.061/+0.094), +44% total money. Win rate reads
# ~64-68% (NOT the 87% friendly-week live sample). BACKTEST/idealized -> expect ~half
# live; this RESETS the live-validation clock for the 15m cell. enabled=false reverts.
[v2.i15m]
enabled = true
z_min = 0.70
edge_min = 0.06
max_ask = 0.70
late_entry_max_ttl_s = 540
vol_lookback_s = 120
recal_path = "data/v2/recal_15m.json"
recal_capacity = 300
recal_warmup = 50
vol_cap = 1.0
dvr_floor = 0.2
edge_ref = 0.08
min_ttl_s = 30
# Book-unmoved gate for 15m (same as 5m; paper-log). Default ON for comparability.
book_unmoved_gate = true
# Order #11 B — 15m REGIME FLOORS (now config-wired; were hard-0.0 = 5m-scoped).
# The 15m tape breathes more than 5m (900s horizon, vol120 denom), so the floors
# scale DOWN from 5m: disp_floor_bps 2.0 (same absolute move threshold — a <2bps
# displacement is noise at any horizon), vol60_floor 0.07 (lower than 5m's 0.12 —
# a 15m market clears on thinner realized vol, so a 0.12 floor would cut real
# late-entry edge). Both compose with the existing z_min/edge_min gates. Reject if
# |disp_bps| < 2.0 OR vol60 < 0.07. 0.0 = OFF (reverts to un-floored 15m).
disp_floor_bps = 2.0
vol60_floor = 0.07

# No [exits.cells] → every cell uses Baseline (hold-to-settle). v2 positions
# carry exit_ts_s past resolution; the redemption task claims the winner.

# Live dashboard. Bound to localhost; view from your PC via an SSH tunnel:
#   ssh -N -L 8787:127.0.0.1:8787 user@vps    →  http://localhost:8787
[dashboard]
enabled = true
bind = "127.0.0.1"
port = 8787
